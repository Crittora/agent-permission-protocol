site_name: "Agent Permission Protocol (APP): Execution-Time Authority for AI Agents"
site_description: "The Agent Permission Protocol (APP) defines explicit, cryptographically verifiable authority for AI agent actions, enforced at execution time."
site_url: https://www.agentpermissionprotocol.com
repo_url: https://github.com/Crittora/agent-permission-protocol
repo_name: Crittora/agent-permission-protocol

theme:
  name: material
  custom_dir: docs/overrides
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra:
  app_version: v0.4.0
  org_name: Crittora
  org_url: https://www.crittora.com/

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js
  - javascripts/mermaid.js

nav:
  - Overview: index.md
  - Whitepaper: whitepaper.md
  - FAQ: faq.md
  - Versioning: versioning.md
  - Changelog: changelog.md
  - Contributing: contributing.md
  - License: license.md
